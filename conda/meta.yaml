{% set name = "nabla" %}
{% set version = "1.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/CNHume/nabla/archive/refs/tags/v{{ version }}.tar.gz
  sha256: d2eaad0033664e750c2ba35ae8266e7cac0219e59e5233b8a2ce0c6ad3545735

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('nabla', max_pin="x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}

test:
  commands:
    - nabla -V
    - nabla64 -V

about:
  home: https://github.com/CNHume/nabla
  license: LGPL-3.0-or-later
  license_file:
    - cli/LICENSES/COPYING_LESSER.txt
    - cli/LICENSES/COPYING.txt
  summary: "Longest Common Subsequence (LCS) of two sequences or files, with automatic algorithm selection, FASTA input, and SAM CIGAR output."
  description: |
    nabla finds the Longest Common Subsequence (LCS) of two record or text
    sequences, selecting automatically among four algorithms — Myers,
    Hunt-Szymanski, RickSpace, or RickTime — based on the input's edit
    distance, match count, and alphabet size.  It reads FASTA (-F) and emits
    SAM CIGAR alignments (-G), so nucleotide and protein sequences can be
    compared.  The nabla64 build lifts the 32-bit length limit for
    whole-genome inputs.

extra:
  recipe-maintainers:
    - CNHume
  identifiers:
    - doi:10.5281/zenodo.24474949
