# Bioconda recipe for nabla.
#
# Submit meta.yaml + build.sh to bioconda-recipes under recipes/nabla/.
#
# The source/url/sha256 below still describe v1.0.0, which predates the
# nabla/ -> cli/ directory rename; re-point them at the next tag before
# submitting so license_file matches the tarball layout.

{% set name = "nabla" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/CNHume/nabla/archive/refs/tags/v{{ version }}.tar.gz
  sha256: cc4c8f98e54f7dff1f95d96209e3244fc418e8accb01c0b51c85c3059aacafac

build:
  number: 0

requirements:
  build:
    - make
    - {{ compiler('cxx') }}

test:
  commands:
    - nabla -V

about:
  home: https://github.com/CNHume/nabla
  license: LGPL-3.0-or-later
  license_file:
    - cli/LICENSES/COPYING_LESSER.txt
    - cli/LICENSES/COPYING.txt
  summary: "Longest common subsequence of two sequences or files, with FASTA input and CIGAR output."
  description: |
    nabla finds the longest common subsequence (LCS) of two files or
    records, selecting among Myers, Hunt-Szymanski, RickSpace, and RickTime
    via automatic dispatch.  It reads FASTA (-F) and emits SAM CIGAR
    alignments (-G).

extra:
  recipe-maintainers:
    - CNHume
