# Bioconda recipe for nabla.
#
# Submit meta.yaml + build.sh to bioconda-recipes under recipes/nabla/.

{% set name = "nabla" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/CNHume/nabla/archive/refs/tags/v{{ version }}.tar.gz
  sha256: d706bfebac71c666d32926c510d00ac32e30c35c947d5b3ca5bf31ef025163fa

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('nabla', max_pin="x") }}

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}

test:
  commands:
    - nabla -V
    - nabla64 -V

about:
  home: https://github.com/CNHume/nabla
  license: LGPL-3.0-or-later
  license_file:
    - cli/LICENSES/COPYING_LESSER.txt
    - cli/LICENSES/COPYING.txt
  summary: "Longest common subsequence of two sequences or files, supporting FASTA input and CIGAR output."
  description: |
    nabla finds the longest common subsequence (LCS) of two files or
    records, selecting the Myers, Hunt-Szymanski, RickSpace, or RickTime
    algorithm automatically.  It reads FASTA (-F) and emits SAM CIGAR
    alignments (-G).

    Installs both nabla (32-bit) and nabla64 (64-bit).  Use nabla64 when
    either input contains more than 4,294,967,296 positions.

extra:
  recipe-maintainers:
    - CNHume
